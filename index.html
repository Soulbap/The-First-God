<!doctype html>
<html lang="no" data-epoch="genesis">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE FIRST GOD — Genesis-01</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/ui/tokens.css">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <canvas id="globe" aria-hidden="true" hidden></canvas>
  <canvas id="world" aria-label="Verden"></canvas>
  <div id="loading">Verden males …</div>

  <div id="hud">
    <section id="resources" class="panel resbar" aria-label="Ressurser"></section>
    <section id="divine" class="panel resbar resbar--divine" aria-label="Guddommelig kraft" hidden></section>

    <div id="hint" class="hint hide" role="status"></div>
    <div id="toasts" aria-live="polite"></div>

    <aside id="drawer" class="panel drawer" aria-labelledby="drawer-title" inert>
      <header class="drawer-head">
        <div>
          <h2 id="drawer-title" class="display" tabindex="-1">Innsikter</h2>
          <p id="drawer-sub" class="drawer-sub"></p>
        </div>
        <button id="drawer-close" class="icon-btn" type="button" aria-label="Lukk panelet"></button>
      </header>
      <div id="drawer-tabs" class="tabs" role="tablist" aria-label="Kategorier" hidden></div>
      <div id="drawer-body" class="drawer-body">
        <div id="insight-list" class="cards"></div>
        <p id="insight-empty" class="empty" hidden></p>
        <ol id="milestone-list" class="milestones" hidden></ol>
        <div id="realm-panel" class="realm" hidden></div>
      </div>
    </aside>

    <nav id="nav" class="panel nav" aria-label="Hovedmeny">
      <button type="button" class="nav-btn" data-nav="insights" aria-controls="drawer" aria-expanded="false">
        <span class="nav-ico" data-icon="insight"></span><span class="nav-lbl">Innsikter</span><span class="badge" hidden></span>
      </button>
      <button type="button" class="nav-btn" data-nav="milestones" aria-controls="drawer" aria-expanded="false" hidden>
        <span class="nav-ico" data-icon="flag"></span><span class="nav-lbl">Milepæler</span>
      </button>
      <button type="button" class="nav-btn" data-nav="realm" aria-controls="drawer" aria-expanded="false" hidden>
        <span class="nav-ico" data-icon="realm"></span><span class="nav-lbl">Rike</span>
      </button>
      <button type="button" class="nav-btn" data-nav="ragnarok" aria-haspopup="dialog">
        <span class="nav-ico" data-icon="ragnarok"></span><span class="nav-lbl">Ragnarok</span>
      </button>
    </nav>

    <div id="controls" class="panel controls">
      <div class="group" role="group" aria-label="Spillfart">
        <button type="button" data-speed="0" aria-label="Pause (mellomrom)" title="Pause (mellomrom)" data-icon="pause"></button>
        <button type="button" data-speed="1" title="Normal fart (1)">1×</button>
        <button type="button" data-speed="2" title="Dobbel fart (2)">2×</button>
        <button type="button" data-speed="4" title="Firedobbel fart (3)">4×</button>
      </div>
      <div class="group" role="group" aria-label="Utsnitt">
        <button type="button" data-view="near" title="Nær: leiren og menneskene">Nær</button>
        <button type="button" data-view="area" disabled title="Låses opp ved milepælen Sammenhengende bosetting">Område</button>
        <button type="button" data-view="world" hidden title="Planet: den samme verdenen sett fra høyt over kloden (V)">Planet</button>
      </div>
      <div class="group" role="group" aria-label="Zoom">
        <button type="button" data-zoom="out" aria-label="Zoom ut" title="Zoom ut" data-icon="minus"></button>
        <button type="button" data-zoom="in" aria-label="Zoom inn" title="Zoom inn" data-icon="plus"></button>
      </div>
    </div>

    <div id="scale" class="scale-chip" aria-live="polite" hidden></div>
    <div id="brand"><span class="title">THE FIRST GOD</span><span class="sub">Genesis-01</span></div>

    <div id="dialog" hidden>
      <div class="panel dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title" class="display">Ragnarok</h2>
        <p class="lead">Avslutt denne syklusen frivillig og begynn på nytt i den samme grunnverdenen.</p>
        <div id="ragnarok-summary"></div>
        <div class="actions">
          <button id="ragnarok-cancel" type="button" class="btn btn-quiet">Behold denne verdenen</button>
          <button id="ragnarok-confirm" type="button" class="btn btn-danger">Utløs Ragnarok</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
